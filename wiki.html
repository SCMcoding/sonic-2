<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | My Website</title>
  <!-- Change colors, fonts, and the banner image in style.css. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Replace images/banner.png with your own PNG banner. -->
  <header id="home">
    <h1>Website Title</h1>
    <p>Write a short description of your website here.</p>
  </header>

  <!-- Each navigation link opens a separate HTML file. -->
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="gallery.html" aria-current="page">Gallery</a>
    <a href="contact.html">Contact</a>
  </nav>

  <main>
    <!-- To add a photo, replace a placeholder with:
         <div class="picture"><img src="images/gallery/photo1.png" alt="Description of photo"></div>
         Put your photo in the images folder. -->
    <section id="gallery">
      <h2>Gallery</h2>
      <p>Add your pictures below.</p>
      <div class="gallery">
        <!-- Replace these sample PNG files inside images/gallery/ -->
        <div class="picture"><img src="images/gallery/photo1.png" alt="Gallery image 1"></div>
        <div class="picture"><img src="images/gallery/photo2.png" alt="Gallery image 2"></div>
        <div class="picture"><img src="images/gallery/photo3.png" alt="Gallery image 3"></div>
      </div>
    </section>
    <section class="section-muted">
      <h2>About These Pictures</h2>
      <p>Write captions or describe your gallery here.</p>
    </section>
  </main>

  <footer>
    <p>Website Footer — Your Name</p>
  </footer>
</body>
</html>
